<div class="toast-container">
  <ng-container *ngFor="let alerta of alertas">
    <app-alerta-global
      [tipo]="alerta.tipo"
      [visible]="true"
      [mensaje]="alerta.mensaje"
      (cerrar)="cerrarAlerta(alerta)">
    </app-alerta-global>
  </ng-container>
</div>
<router-outlet></router-outlet>
